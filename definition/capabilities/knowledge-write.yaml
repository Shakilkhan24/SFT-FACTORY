# knowledge.write — pack 04 §5's v1 capability registry.
#
# record stage.
#
# The scope is what a grant must cover; the resource pattern is what the
# resource-scope check matches the concrete target against. Both are
# load-bearing: a grant that permits the capability but is scoped to another
# repository is refused on the resource, not on the capability.

apiVersion: factory/v1
kind: ToolCapability
metadata:
  name: knowledge.write
  version: "1.0.0"
spec:
  owner: factory-platform
  kind: mutation
  transport: inproc
  effect:
    class: E1
    reversible: true
    external: false
  scope:
    required:
      - "knowledge.write"
    resourcePattern: "run:{runId}"
    environment: "orchestrator"
  credentials:
    provider: "none"
    permissions: {}
    ttlSeconds: 60
  inputSchema:
    $ref: "schemas/capabilities/knowledge.write.input.schema.json"
  outputSchema:
    $ref: "schemas/capabilities/knowledge.write.output.schema.json"
  trust:
    inputTrust: trusted
    resultTrust: trusted
  health:
    check: "the knowledge store is reachable"
    timeoutMs: 30000
    degraded: "knowledge.write is degraded; the call may fail"
  observability:
    redactArguments: []
  cost:
    unit: "call"
    usdMicros: 0
