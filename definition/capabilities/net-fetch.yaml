# net.fetch — pack 04 §5's v1 capability registry.
#
# D-1 (OSV, registry metadata).
#
# The scope is what a grant must cover; the resource pattern is what the
# resource-scope check matches the concrete target against. Both are
# load-bearing: a grant that permits the capability but is scoped to another
# repository is refused on the resource, not on the capability.

apiVersion: factory/v1
kind: ToolCapability
metadata:
  name: net.fetch
  version: "1.0.0"
spec:
  owner: factory-platform
  kind: read
  transport: inproc
  effect:
    class: E0
    reversible: true
    external: true
  scope:
    required:
      - "net.fetch"
    resourcePattern: "host:{host}"
    environment: "orchestrator"
  credentials:
    provider: "none"
    permissions: {}
    ttlSeconds: 60
  inputSchema:
    $ref: "schemas/capabilities/net.fetch.input.schema.json"
  outputSchema:
    $ref: "schemas/capabilities/net.fetch.output.schema.json"
  trust:
    inputTrust: trusted
    resultTrust: untrusted
  health:
    check: "the fetch service is reachable"
    timeoutMs: 30000
    degraded: "net.fetch is degraded; the call may fail"
  observability:
    redactArguments: []
  cost:
    unit: "call"
    usdMicros: 0
