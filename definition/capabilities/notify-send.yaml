# notify.send — pack 04 §5's v1 capability registry.
#
# ops.
#
# The scope is what a grant must cover; the resource pattern is what the
# resource-scope check matches the concrete target against. Both are
# load-bearing: a grant that permits the capability but is scoped to another
# repository is refused on the resource, not on the capability.

apiVersion: factory/v1
kind: ToolCapability
metadata:
  name: notify.send
  version: "1.0.0"
spec:
  owner: factory-platform
  kind: communicate
  transport: http
  effect:
    class: E2
    reversible: false
    external: true
  scope:
    required:
      - "notify.send"
    resourcePattern: "host:{host}"
    environment: "orchestrator"
  credentials:
    provider: "none"
    permissions: {}
    ttlSeconds: 60
  inputSchema:
    $ref: "schemas/capabilities/notify.send.input.schema.json"
  outputSchema:
    $ref: "schemas/capabilities/notify.send.output.schema.json"
  trust:
    inputTrust: trusted
    resultTrust: trusted
  health:
    check: "the notification service is reachable"
    timeoutMs: 30000
    degraded: "notify.send is degraded; the call may fail"
  observability:
    redactArguments: []
  cost:
    unit: "call"
    usdMicros: 0
