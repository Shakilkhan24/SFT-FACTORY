# docker-compose.dev.yml — the W1–W5 local dependencies.
#
# pack 05, T-0.01: "Postgres + bucket (or `docker-compose.dev.yml` for
# W1–W5)". pack 01 ADR-0025: "Postgres 16+ with PITR; S3-compatible bucket
# with versioning".
#
# This file is for DEVELOPMENT ONLY. It is not the production deployment —
# that is checklist 10. Nothing here is exposed to a public interface.

services:
  postgres:
    image: postgres:16-alpine
    container_name: factory-postgres-dev
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
      # The dev cluster uses a fixed, non-secret password. It binds to
      # localhost and is never deployed (ADR-0025).
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - factory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U factory -d factory']
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - postgres
      - -c
      - max_connections=100

  minio:
    # KNOWN-DEFECT (2026-11-09, spike S-1 §3.1): the `minio/minio` Docker Hub repository
    # no longer exists — MinIO's community edition was archived and its images removed.
    # `docker compose up` fails on this service with "pull access denied for minio/minio".
    #
    # The successor image was NOT verified from the environment that found the defect
    # (hub.docker.com and quay.io/minio/minio were both unreachable/unauthenticated), and
    # HR-11 forbids coding against a remembered reference. The owner must supply a current
    # image reference, verified against the official MinIO distribution channel.
    #
    # Postgres is unaffected and is what spike S-1 ran against.
    # To run with Postgres only:  docker compose -f docker-compose.dev.yml up -d postgres
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: factory-minio-dev
    environment:
      MINIO_ROOT_USER: factory
      MINIO_ROOT_PASSWORD: factory-secret
    command: server /data --console-address ":9001"
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - factory-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  factory-pgdata:
  factory-minio:
