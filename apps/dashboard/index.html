<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The dashboard is private (D9), so it declares that it must not be
      indexed and it must not leak its URL to a third party. The
      `referrer` policy is the strict one for the same reason.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Software Factory — operational surface</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
